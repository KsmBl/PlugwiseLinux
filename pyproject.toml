[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plugwise-stick"
version = "0.2.0"
description = "Linux userspace driver for Plugwise Stick, Circle+ and Circle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
plugwise = "plugwise_stick.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
